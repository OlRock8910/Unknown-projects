<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ReelBox: watch the videos on your phone like a streaming app." />
    <title>ReelBox</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0f'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23e5484d'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="logo">REEL<span>BOX</span></div>
      <div class="top-actions">
        <button class="btn btn-glass btn-sm" data-a="import" hidden>+ Add videos</button>
        <button class="gear" data-a="tab" data-tab="settings" aria-label="Settings"></button>
      </div>
    </header>
    <main id="screen"></main>
    <div class="mini" hidden></div>
    <nav class="tabbar"></nav>
    <div class="sheet-wrap" hidden></div>
    <div class="selbar" hidden></div>
    <div class="toast" role="status"></div>
    <input id="file-input" type="file" accept="video/*" multiple hidden />
    <input id="music-input" type="file" accept="audio/*,.mp3,.m4a,.flac,.ogg,.wav" multiple hidden />
    <!-- A whole folder: each folder inside it becomes a playlist. -->
    <input id="music-folder-input" type="file" webkitdirectory multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
