# Tests and builds IronLog (the gym tracker in ironlog/).
# ReelBox has its own workflow in build.yml, Adjetivos in adjetivos.yml.
name: Build IronLog APK

on:
  push:
    branches: [main]
    paths: ['ironlog/**', '.github/workflows/ironlog.yml']
  pull_request:
    paths: ['ironlog/**', '.github/workflows/ironlog.yml']
  workflow_dispatch:

permissions:
  # Needed to publish the APK as a release asset.
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ironlog
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner image already ships the SDK and Gradle fetches whatever
          # platform the project asks for; the action's default package list
          # includes the removed "tools" package and would fail.
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # An APK signed by a key that changes between builds will not install over
      # the previous one ("App not installed"), so pin the certificate here.
      - name: Check the APK is signed with the IronLog key
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          GOT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          EXPECTED=45ea60459b9f92a8c8d830628c42dae6279031633e72ead5ce44ca3ecb8dc431
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::APK is signed by $GOT, expected $EXPECTED"
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/IronLog.apk
          ls -lh out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IronLog-apk
          path: ironlog/out/IronLog.apk
          if-no-files-found: error

      # Artifacts need a GitHub login and arrive zipped. A release asset is one
      # tap on a phone, so the newest build is also published to a rolling tag.
      - name: Publish the APK as a release
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="ironlog-latest"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --title "IronLog for Android (latest build)" \
            --notes "The newest build of IronLog. Open IronLog.apk on your phone to install; later builds install over it and keep your data." \
            --target "$GITHUB_SHA" --latest=false
          # ReelBox's download button points at the repo's latest release; keep IronLog off it.
          gh release edit "$tag" --title "IronLog $version for Android (latest build)" --latest=false
          for attempt in 1 2 3 4; do
            if timeout 240 gh release upload "$tag" out/IronLog.apk --clobber; then
              echo "Attached IronLog.apk on attempt $attempt"
              break
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::Could not attach IronLog.apk to the $tag release"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          echo "Direct link: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/IronLog.apk"

      # After the upload, so a failure here is loud but the APK from this commit
      # is still downloadable.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            ironlog/app/build/reports/tests/testDebugUnitTest
            ironlog/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
