name: Build Adjetivos APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version code is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23 zip

      - name: Browser smoke test (every game)
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
          node tests/smoke.mjs

      - name: Build APK
        run: ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adjetivos-apk
          path: build/Adjetivos.apk
          if-no-files-found: error
