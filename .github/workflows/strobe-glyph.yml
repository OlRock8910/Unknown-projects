# Tests and builds Strobe Glyph (the flashlight strobe app in strobe-glyph/).
name: Build Strobe Glyph APK

on:
  push:
    paths:
      - 'strobe-glyph/**'
      - '.github/workflows/strobe-glyph.yml'
  pull_request:
    paths:
      - 'strobe-glyph/**'
      - '.github/workflows/strobe-glyph.yml'
  workflow_dispatch:

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strobe-glyph
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already carries the Android SDK (ANDROID_HOME) with licences accepted;
      # Gradle fetches any missing platform or build-tools on demand.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/StrobeGlyph.apk
          ls -lh out

      # An APK that is unsigned, or signed by a key that changes between runs, installs
      # nowhere, and the only symptom is "App not installed" on the phone. Check it here, and
      # pin the certificate so a signing change cannot silently break upgrades.
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -list -keystore app/strobe-sideload.jks \
            -storepass strobeglyph -alias strobeglyph -v \
            | grep -oiE 'SHA256: [0-9A-F:]+' | head -1 | tr -d ' ' | cut -d: -f2- | tr -d ':' | tr 'A-Z' 'a-z')
          "$APKSIGNER" verify --verbose out/StrobeGlyph.apk
          GOT=$("$APKSIGNER" verify --print-certs out/StrobeGlyph.apk \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          if [ "$GOT" != "$EXPECTED" ]; then
            echo "::error::APK is signed by $GOT, expected the sideload key $EXPECTED"
            exit 1
          fi
          echo "signed by the sideload key"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StrobeGlyph-apk
          path: strobe-glyph/out/StrobeGlyph.apk
          if-no-files-found: error
