# Tests and builds Lingo Peak (the language course in lingopeak/).
# ReelBox has its own workflow in build.yml.
name: Build Lingo Peak APK

on:
  push:
    branches: [main]
    paths: ['lingopeak/**', '.github/workflows/lingopeak.yml']
  pull_request:
    paths: ['lingopeak/**', '.github/workflows/lingopeak.yml']
  workflow_dispatch:

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lingopeak
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23 zip

      - name: Browser smoke test (course, lessons, games)
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
          node tests/smoke.mjs

      - name: Build APK
        run: ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingopeak-apk
          path: lingopeak/build/LingoPeak.apk
          if-no-files-found: error
