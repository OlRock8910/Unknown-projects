# Tests and builds Spark (the AI chat app in spark/).
name: Build Spark APK

on:
  push:
    branches: [main]
    paths: ['spark/**', '.github/workflows/spark.yml']
  pull_request:
    paths: ['spark/**', '.github/workflows/spark.yml']
  workflow_dispatch:

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt dalvik-exchange zipalign apksigner android-sdk-platform-23 zip

      - name: Install test tools
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Browser test (against a stand-in Claude API)
        run: node tests/smoke.mjs

      - name: Free brain test (stand-ins for the model and Wikipedia)
        run: node tests/free-brain.mjs

      - name: Build APK
        run: ./build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: spark-apk
          path: spark/build/Spark.apk
          if-no-files-found: error
