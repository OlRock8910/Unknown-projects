plugins {
    id 'com.android.application'
}

android {
    namespace 'com.infinink.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.infinink.app'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.4.0'
    }

    signingConfigs {
        // A fixed, deliberately public key so every build shares one signature and a newer APK
        // installs over an older one. Sideload builds only; a store release would need a private
        // key kept out of the repo.
        sideload {
            // The key is still named "infinink" from before the app was renamed; keep it, or
            // new builds will not install over old ones.
            storeFile file('sketchnote-sideload.jks')
            storePassword 'infinink'
            keyAlias 'infinink'
            keyPassword 'infinink'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
    }

    androidResources {
        // The bundled fonts load straight from the APK.
        noCompress 'ttf'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
