      <td style="background:#2F5BEA;padding:18px 24px;">

          <td style="vertical-align:middle;"><img src="https://raw.githubusercontent.com/OlRock8910/Unknown-projects/main/lingopeak/docs/email/logo.png" width="40" height="40" alt="" style="display:block;border-radius:10px;"></td>
